name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    name: Run Rails specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.2
          bundler-cache: true   

      - name: Install dependencies
        run: |
          cd back
          bundle install --jobs 4 --retry 3
      - name: Run RSpec
        run: |
          cd back
          bundle exec rspec

  frontend-tests:
    name: Run Next.js tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: |
          cd front
          yarn install
      - name: Run tests
        run: |
          cd front
          yarn test
